name: Self-test

# בונה ומריץ בדיקות (בלי לפרסם Release) על כל ענף שאינו main
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: chmod +x build.sh && ./build.sh
      - name: Self-test
        run: .github/selftest.sh
