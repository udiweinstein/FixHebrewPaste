name: Self-test

# בונה ומריץ בדיקות (בלי לפרסם Release) על כל ענף שאינו main
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: chmod +x build.sh && ./build.sh
      - name: Self-test (built-in OCR only)
        run: LABEL="no Tesseract" .github/selftest.sh
      - name: Install Tesseract with Hebrew
        run: |
          brew install tesseract
          curl -fsSL -o "$(brew --prefix)/share/tessdata/heb.traineddata" \
            https://github.com/tesseract-ocr/tessdata/raw/main/heb.traineddata
      - name: Self-test (with Tesseract)
        run: LABEL="with Tesseract" .github/selftest.sh
